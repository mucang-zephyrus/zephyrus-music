<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050609" />
    <meta
      name="description"
      content="Zephyrus Music，一款只为 Android 手机设计的逐字歌词音乐播放器。自有 TTML、AMLL、YRC 与 QRC 汇入同一条逐字时间轴。"
    />
    <link rel="icon" href="/zephyrus-mark.png" />
    <link rel="preload" as="image" href="/zephyrus-mark.png" />
    <title>Zephyrus Music · Android 逐字歌词播放器</title>
  </head>
  <body>
    <script>
      // 临时调试：收集应用挂载期错误（审核通过后移除）
      window.__errs = [];
      window.addEventListener('error', function (e) {
        window.__errs.push('E: ' + e.message + ' @' + e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('R: ' + String((e.reason && e.reason.stack) || e.reason));
      });
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
