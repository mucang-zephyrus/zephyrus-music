# Include once in the mucang.xyz HTTPS server block.
location = /zephyrus/webtest {
    return 301 /zephyrus/webtest/;
}
location ~ ^/zephyrus/webtest/.*\.part$ {
    return 404;
}
location ~ ^/zephyrus/webtest/(?:latest\.json|[^/]+\.apk)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "https://localhost" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
}
location = /zephyrus/webtest/index.html {
    add_header Cache-Control "no-cache";
}
location ^~ /zephyrus/webtest/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /zephyrus/webtest/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
