location = /zephyrus/api-test/platform/qq/cover-sample {
    access_log off;
    proxy_pass http://127.0.0.1:3052/platform/qq/cover-sample;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
}
location ^~ /zephyrus/api-test/platform/ {
    if ($uri !~ "^/zephyrus/api-test/platform/(health|qq/(qr/(create|poll)|account/data|playlist/tracks|search|lyric|album|singer/songs|api/(login/(channels|status|refresh|qr/(key|create|check))|user/(detail|playlist|playlist-detail)|getMusicPlay/[^/]+))|kugou/(qr/(create|poll)|account/data|playlist/tracks|search|lyric|api/(login/(qr/(key|create|check)|token/refresh)|song/url)))$") {
        return 404;
    }
    access_log off;
    proxy_pass http://127.0.0.1:3052/platform/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}
