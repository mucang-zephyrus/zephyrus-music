# Put beside the Enhanced gateway location in the HTTPS server block.
location = /zephyrus/api/netease-enhanced/scrobble/v1 {
    if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
    access_log off;
    proxy_pass http://127.0.0.1:3051/scrobble/v1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header X-Apicache-Bypass 1;
    proxy_next_upstream off;
    proxy_read_timeout 30s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}
