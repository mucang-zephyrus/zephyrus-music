# Insert inside the HTTPS server block, before the existing /zephyrus/api/ location.
location ^~ /zephyrus/api/netease-enhanced/ {
    proxy_pass http://127.0.0.1:3051/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Query strings contain credentials; do not write them into access logs.
    access_log off;
}
